<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VRChat Events</title>

  <link
    rel="stylesheet"
    href="select.css"
  >
</head>

<body>

  <main class="event-select">

    <div class="select-header">

      <p class="select-small">
        VRChat EVENTS
      </p>

      <h1>
        SELECT YOUR NIGHT
      </h1>

      <p class="select-copy">
        今夜、どちらの世界へ。
      </p>

    </div>


    <div class="event-grid">


      <!-- DOWNER CAFE -->

      <a
        href="downer.html"
        class="event-card downer-card"
      >

        <div class="event-glow"></div>

        <div class="event-content">

          <p class="event-type">
            VRChat EVENT
          </p>

          <h2>
            ダウナー喫茶 Dull救世主
          </h2>

          <p class="event-description">
            甘くて、暗くて、<br>
            少しだけ怪しい夜。
          </p>

          <span class="event-enter">
            ENTER
          </span>

        </div>

      </a>



      <!-- PROJECT SHISHA D4N -->

      <a
        href="d4n.html"
        class="event-card d4n-card"
      >

        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>

        <div class="event-content">

          <p class="event-type">
            VRChat SHISHA BAR
          </p>

          <h2 class="d4n-title">
            Project Shisha:D4N
          </h2>

          <p class="event-description">
            煙と灯りに溶ける、<br>
            深夜のひととき。
          </p>

          <span class="event-enter">
            ENTER
          </span>

        </div>

      </a>


    </div>

  </main>

</body>

</html>
